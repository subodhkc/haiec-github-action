name: HAIEC Assurance Scan

description: Run the local HAIEC scanner in the GitHub runner, submit qualified evidence, and start the canonical Assurance Run.
author: HAIEC

branding:
  icon: shield
  color: green

inputs:
  haiec-api-key:
    description: HAIEC API key with scan:submit and scan:create
    required: true
  ai-system-id:
    description: Organization-bound HAIEC AI System ID
    required: true
  wait:
    description: Wait for evaluation completion
    required: false
    default: 'true'
  fail-on-critical:
    description: Fail the job when critical findings are returned by the local policy result
    required: false
    default: 'false'
  fail-on-high:
    description: Fail the job when high findings are returned by the local policy result
    required: false
    default: 'false'
  fail-on-findings:
    description: Fail the job when any local findings are returned
    required: false
    default: 'false'
  output-dir:
    description: Local scanner artifact directory
    required: false
    default: haiec-results
  upload-sarif:
    description: Upload local SARIF to GitHub Code Scanning
    required: false
    default: 'true'

outputs:
  scan-id:
    description: Qualified scan ID
    value: ${{ steps.scan.outputs.scan_id }}
  run-id:
    description: Assurance Run ID
    value: ${{ steps.scan.outputs.run_id }}
  evaluation-id:
    description: Assurance Evaluation ID when available
    value: ${{ steps.scan.outputs.evaluation_id }}
  disposition:
    description: Canonical disposition when available
    value: ${{ steps.scan.outputs.disposition }}
  report-url:
    description: Canonical report URL when available
    value: ${{ steps.scan.outputs.report_url }}
  passport-url:
    description: Canonical Passport URL when available
    value: ${{ steps.scan.outputs.passport_url }}
  findings-total:
    description: Local scanner finding total
    value: ${{ steps.scan.outputs.findings_total }}
  findings-critical:
    description: Local scanner critical finding total
    value: ${{ steps.scan.outputs.findings_critical }}
  findings-high:
    description: Local scanner high finding total
    value: ${{ steps.scan.outputs.findings_high }}

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run local HAIEC scan and Assurance
      id: scan
      shell: bash
      env:
        HAIEC_API_KEY: ${{ inputs.haiec-api-key }}
        HAIEC_AI_SYSTEM_ID: ${{ inputs.ai-system-id }}
      run: |
        set -euo pipefail
        mkdir -p "${{ inputs.output-dir }}"
        npx --yes @haiec/cli@0.1.0 scan local . \
          --system "$HAIEC_AI_SYSTEM_ID" \
          --submit \
          $([ "${{ inputs.wait }}" = "true" ] && echo --wait) \
          --output "${{ inputs.output-dir }}" \
          --json > "${{ inputs.output-dir }}/haiec-result.json"

        jq -r '"scan_id=" + (.submitted.scan.scanId // "")' "${{ inputs.output-dir }}/haiec-result.json" >> "$GITHUB_OUTPUT"
        jq -r '"run_id=" + (.submitted.run.runId // "")' "${{ inputs.output-dir }}/haiec-result.json" >> "$GITHUB_OUTPUT"
        jq -r '"evaluation_id=" + (.submitted.run.evaluation.evaluationId // "")' "${{ inputs.output-dir }}/haiec-result.json" >> "$GITHUB_OUTPUT"
        jq -r '"disposition=" + (.submitted.run.evaluation.disposition // "")' "${{ inputs.output-dir }}/haiec-result.json" >> "$GITHUB_OUTPUT"
        jq -r '"report_url=" + (.submitted.run.links.report // "")' "${{ inputs.output-dir }}/haiec-result.json" >> "$GITHUB_OUTPUT"
        jq -r '"passport_url=" + (.submitted.run.links.passport // "")' "${{ inputs.output-dir }}/haiec-result.json" >> "$GITHUB_OUTPUT"
        jq -r '"findings_total=" + ((.statistics.findings_total // 0)|tostring)' "${{ inputs.output-dir }}/haiec-result.json" >> "$GITHUB_OUTPUT"
        jq -r '"findings_critical=" + ((.statistics.findings_by_severity.critical // 0)|tostring)' "${{ inputs.output-dir }}/haiec-result.json" >> "$GITHUB_OUTPUT"
        jq -r '"findings_high=" + ((.statistics.findings_by_severity.high // 0)|tostring)' "${{ inputs.output-dir }}/haiec-result.json" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      continue-on-error: true
      with:
        sarif_file: ${{ inputs.output-dir }}/haiec-scan.sarif
        category: haiec-local-assurance

    - name: Enforce local findings policy
      shell: bash
      run: |
        set -euo pipefail
        total=$(jq -r '.statistics.findings_total // 0' "${{ inputs.output-dir }}/haiec-result.json")
        critical=$(jq -r '.statistics.findings_by_severity.critical // 0' "${{ inputs.output-dir }}/haiec-result.json")
        high=$(jq -r '.statistics.findings_by_severity.high // 0' "${{ inputs.output-dir }}/haiec-result.json")
        if [ "${{ inputs.fail-on-findings }}" = "true" ] && [ "$total" -gt 0 ]; then exit 1; fi
        if [ "${{ inputs.fail-on-critical }}" = "true" ] && [ "$critical" -gt 0 ]; then exit 1; fi
        if [ "${{ inputs.fail-on-high }}" = "true" ] && [ "$high" -gt 0 ]; then exit 1; fi
